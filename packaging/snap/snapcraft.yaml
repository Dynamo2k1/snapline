name: snapline
base: core24
version: '0.2.2'
summary: Region screenshot tool with annotation and upload
description: |
  Press a hotkey, drag over the part of the screen you want, mark it up with
  pen, line, arrow, rectangle, circle, marker, text and blur tools, then copy
  it, save it, print it or upload it to Imgur or your own server.
license: GPL-3.0-or-later
grade: stable
confinement: strict
icon: resources/icons/snapline.svg

apps:
  snapline:
    command: usr/bin/snapline
    desktop: usr/share/applications/io.github.snapline.Snapline.desktop
    common-id: io.github.snapline.Snapline
    extensions: [kde-neon-6]
    plugs:
      - network
      - home
      - desktop
      - wayland
      - x11
      - unity7

parts:
  snapline:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    build-packages:
      - ninja-build
      - pkgconf
      - libxcb1-dev
      - libxcb-xfixes0-dev
      - libx11-dev
