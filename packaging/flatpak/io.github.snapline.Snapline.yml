app-id: io.github.snapline.Snapline
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: snapline
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Notifications, tray icon (StatusNotifierItem) and "show in folder".
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.FileManager1
  # Default save folder; other locations go through the file chooser portal.
  - --filesystem=xdg-pictures
modules:
  - name: snapline
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
